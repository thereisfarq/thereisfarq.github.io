<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>thereisfarq</title>
  <meta name="description" content="Small, entirely client-side tools by thereisfarq." />
  <style>
    @font-face {
      font-family: "Bebas Neue";
      src: url("./BebasNeue-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #111111;
      --white: #ffffff;
      --red: #b00000;
      --stroke: rgba(255, 255, 255, 0.9);
      --radius: 24px;
      --gap: 14px;
      --ease: 220ms cubic-bezier(.2,.7,.2,1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      padding: clamp(14px, 2.2vw, 30px);
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .bento {
      width: min(1500px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: minmax(150px, 1fr);
      gap: var(--gap);
      min-height: calc(100vh - clamp(28px, 4.4vw, 60px));
    }

    .tile {
      position: relative;
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: flex-end;
      padding: clamp(18px, 2vw, 30px);
      isolation: isolate;
      transition:
        background-color var(--ease),
        color var(--ease),
        border-color var(--ease),
        box-shadow var(--ease),
        transform var(--ease);
    }

    .tile::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--white);
      opacity: 0;
      transition: opacity var(--ease);
    }

    .tile:not(.logo-tile):hover,
    .tile:not(.logo-tile):focus-visible {
      color: var(--red);
      border-color: var(--white);
    }

    .tile:not(.logo-tile):hover::after,
    .tile:not(.logo-tile):focus-visible::after {
      opacity: 1;
    }

    .tile:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 3px;
    }

    .logo-tile {
      grid-column: span 2;
      grid-row: span 2;
      background: var(--white);
      align-items: center;
      justify-content: center;
      padding: clamp(32px, 5vw, 80px);
      border-color: var(--white);
    }

    .logo-tile img {
      width: min(78%, 520px);
      height: auto;
      display: block;
      filter: none;
      transition: filter var(--ease), transform var(--ease);
    }

    /* The supplied SVG is white, so it is deliberately inverted on the white logo tile. */
    .logo-tile img {
      filter: invert(1);
    }

    .logo-tile:hover,
    .logo-tile:focus-visible {
      box-shadow: 0 12px 30px rgba(255,255,255,.12);
    }

    .logo-tile:hover img,
    .logo-tile:focus-visible img {
      filter: invert(1) drop-shadow(0 5px 9px rgba(0,0,0,.2));
    }

    .product-title {
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: clamp(2.2rem, 5vw, 5.4rem);
      line-height: .88;
      letter-spacing: .015em;
      text-transform: none;
      transition: color var(--ease);
    }

    .product-copy {
      position: absolute;
      left: clamp(18px, 2vw, 30px);
      right: clamp(18px, 2vw, 30px);
      bottom: clamp(18px, 2vw, 30px);
      display: grid;
      gap: 10px;
      transform: translateY(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--ease), transform var(--ease);
    }

    .product-description {
      max-width: 32rem;
      font-size: clamp(.85rem, 1.1vw, 1rem);
      line-height: 1.35;
      font-weight: 500;
      color: var(--red);
    }

    .product-action {
      font-size: .68rem;
      line-height: 1;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--red);
      opacity: .62;
    }

    .tile:hover .product-title,
    .tile:focus-visible .product-title {
      opacity: 0;
      transform: translateY(-8px);
    }

    .tile:hover .product-copy,
    .tile:focus-visible .product-copy {
      opacity: 1;
      transform: translateY(0);
    }

    .tile:hover .product-description,
    .tile:focus-visible .product-description,
    .tile:hover .product-action,
    .tile:focus-visible .product-action {
      color: var(--red);
    }

    .bento-tile { grid-column: span 2; }
    .morph-tile { grid-row: span 2; }

    @media (max-width: 900px) {
      .bento {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: minmax(170px, 1fr);
      }

      .logo-tile {
        grid-column: span 2;
        grid-row: span 1;
        min-height: 270px;
      }

      .bento-tile { grid-column: span 1; }
      .morph-tile { grid-row: span 1; }
    }

    @media (max-width: 560px) {
      :root { --gap: 9px; --radius: 17px; }

      body { padding: 9px; }

      .bento {
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: 190px;
        min-height: auto;
      }

      .logo-tile {
        min-height: 220px;
        padding: 28px;
      }

      .logo-tile img { width: min(84%, 330px); }

      .tile { padding: 18px; }
      .product-title { font-size: clamp(2rem, 12vw, 4rem); }

      /* Touch devices have no reliable hover. Keep the product label visible and let tap navigate. */
      @media (hover: none) {
        .tile:hover .product-title,
        .tile:focus-visible .product-title {
          opacity: 1;
          transform: none;
        }

        .tile:hover::after,
        .tile:focus-visible::after {
          opacity: 0;
        }

        .tile:hover,
        .tile:focus-visible {
          color: var(--white);
          box-shadow: none;
        }

        .product-copy { display: none; }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="bento" aria-label="thereisfarq tools">
    <a class="tile logo-tile" href="https://www.thereisfarq.com" aria-label="thereisfarq website">
      <img src="./wordk.svg" alt="thereisfarq" />
    </a>

    <a class="tile bento-tile" href="https://thereisfarq.github.io/bento/">
      <span class="product-title">Bento</span>
      <span class="product-copy">
        <span class="product-description">Instant photo grids. No cropping, nothing uploaded.</span>
        <span class="product-action">Open tool ↗</span>
      </span>
    </a>

    <a class="tile morph-tile" href="https://thereisfarq.github.io/morph/">
      <span class="product-title">Morph</span>
      <span class="product-copy">
        <span class="product-description">Convert images or PDFs into print-ready files.</span>
        <span class="product-action">Open tool ↗</span>
      </span>
    </a>

    <a class="tile" href="https://thereisfarq.github.io/color/">
      <span class="product-title">&lt;Color&gt;</span>
      <span class="product-copy">
        <span class="product-description">Train your eye on RGB and Hex codes.</span>
        <span class="product-action">Open tool ↗</span>
      </span>
    </a>

    <a class="tile" href="https://thereisfarq.github.io/typedup/">
      <span class="product-title">TypedUp</span>
      <span class="product-copy">
        <span class="product-description">Guess the font in a minimal type game.</span>
        <span class="product-action">Open tool ↗</span>
      </span>
    </a>
  </main>
</body>
</html>
