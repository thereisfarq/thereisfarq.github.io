<title>thereisfarq</title>
<meta name="description" content="Small, entirely client-side tools by thereisfarq." />
<style>
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --border: #cccccc;
    --border-subtle: #e5e5e5;
    --accent: #c41e24;
    --muted: #888888;
    --ui-font: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --transition-fast: 180ms ease-out;
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: var(--ui-font);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }

  .home {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 2rem 1.5rem;
  }

  .home__main {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 22rem;
    gap: 3rem;
  }

  .home__mark {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.6rem;
  }

  .home__mark svg {
    width: 118px;
    height: auto;
    display: block;
  }

  .home__tagline {
    margin: 0;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  .home__levels {
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .home__level {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 1.5rem 1rem;
    border-top: 1px solid var(--border-subtle);
    transition: color var(--transition-fast);
  }

  .home__level:last-child { border-bottom: 1px solid var(--border-subtle); }

  .home__level:hover,
  .home__level:focus-visible { color: var(--accent); }

  .home__level-title {
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.06em;
  }

  .home__level-sub {
    margin-top: 0.35rem;
    font-size: 0.8rem;
    opacity: 0.5;
    letter-spacing: 0.02em;
  }

  .home__footer {
    padding: 1.5rem;
    text-align: center;
  }

  .home__footer a {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.28em;
    color: var(--muted);
    text-transform: uppercase;
    transition: color var(--transition-fast);
  }

  .home__footer a:hover { color: var(--accent); }
</style>
</head>
