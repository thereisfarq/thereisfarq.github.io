services:
  - type: web
    name: decibel-api
    runtime: docker
    rootDir: decibel-api
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DECIBEL_ALLOWED_ORIGINS
        value: https://thereisfarq.github.io
      - key: DECIBEL_MAX_UPLOAD_MB
        value: "250"
      - key: DECIBEL_MAX_DURATION_SECONDS
        value: "7200"
